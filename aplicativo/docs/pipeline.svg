<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="1400" height="700" role="img" aria-label="Pipeline do Aura">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1a3a"/>
      <stop offset="1" stop-color="#162d5a"/>
    </linearGradient>
    <linearGradient id="cardBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a6e"/>
      <stop offset="1" stop-color="#142f65"/>
    </linearGradient>
    <linearGradient id="cardDanger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f1d1d"/>
      <stop offset="1" stop-color="#3f0a0a"/>
    </linearGradient>
    <linearGradient id="cardSafe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15803d"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4A6FC7"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#22c55e"/>
    </marker>
  </defs>

  <rect width="1400" height="700" fill="url(#bg)"/>

  <!-- Watermark do escudo -->
  <g opacity="0.05" transform="translate(700,400) scale(0.55) translate(-512,-512)">
    <path d="M512 88 L888 232 L888 514 C888 700 733 852 512 938 C291 852 136 700 136 514 L136 232 Z" fill="#94a7de"/>
  </g>

  <!-- Header -->
  <text x="700" y="58" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="34" font-weight="800" fill="#ffffff">Pipeline do Aura</text>
  <text x="700" y="90" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#94a7de" letter-spacing="6">DETECÇÃO · CAPTURA · ANÁLISE · DESTRUIÇÃO · ALERTA</text>

  <!-- ====== STAGE 01 ====== -->
  <g transform="translate(50,170)">
    <rect width="230" height="400" rx="22" fill="url(#cardBlue)" stroke="#4A6FC7" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="20" y="35" font-family="system-ui,sans-serif" font-size="11" font-weight="800" fill="#94a7de" letter-spacing="3">01</text>
    <g transform="translate(85,55)">
      <rect width="60" height="110" rx="10" fill="#0a1a3a" stroke="#94a7de" stroke-width="2"/>
      <rect x="5" y="12" width="50" height="76" rx="3" fill="#4A6FC7" opacity="0.3"/>
      <circle cx="30" cy="100" r="2.5" fill="#94a7de"/>
      <g transform="translate(15,38)" fill="#94a7de">
        <rect x="0" y="6" width="30" height="14" rx="7"/>
        <circle cx="7" cy="13" r="1.8" fill="#0a1a3a"/>
        <circle cx="23" cy="13" r="1.8" fill="#0a1a3a"/>
        <rect x="4" y="2" width="2" height="6" rx="1"/>
        <rect x="24" y="2" width="2" height="6" rx="1"/>
      </g>
    </g>
    <text x="115" y="220" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="800" fill="#ffffff">Criança abre</text>
    <text x="115" y="243" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="800" fill="#ffffff">um jogo</text>
    <line x1="40" y1="275" x2="190" y2="275" stroke="#4A6FC7" stroke-opacity="0.3"/>
    <text x="115" y="305" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11.5" fill="#94a7de">UsageStats detecta</text>
    <text x="115" y="324" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11.5" fill="#94a7de">se o app está na</text>
    <text x="115" y="343" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11.5" fill="#94a7de">lista do pai</text>
  </g>

  <path d="M285,370 L310,370" stroke="#4A6FC7" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

  <!-- ====== STAGE 02 ====== -->
  <g transform="translate(315,170)">
    <rect width="230" height="400" rx="22" fill="url(#cardBlue)" stroke="#4A6FC7" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="20" y="35" font-family="system-ui,sans-serif" font-size="11" font-weight="800" fill="#94a7de" letter-spacing="3">02</text>
    <g transform="translate(75,60)">
      <rect width="80" height="60" rx="10" fill="#0a1a3a" stroke="#94a7de" stroke-width="2"/>
      <rect x="25" y="-5" width="30" height="10" rx="3" fill="#0a1a3a" stroke="#94a7de" stroke-width="2"/>
      <circle cx="40" cy="30" r="18" fill="none" stroke="#94a7de" stroke-width="2"/>
      <circle cx="40" cy="30" r="11" fill="#4A6FC7" opacity="0.5"/>
      <circle cx="40" cy="30" r="6" fill="#94a7de"/>
      <circle cx="65" cy="13" r="2" fill="#22c55e"/>
    </g>
    <g transform="translate(75,140)">
      <rect width="80" height="22" rx="11" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1"/>
      <text x="40" y="15" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="800" fill="#22c55e" letter-spacing="1">RAM ONLY</text>
    </g>
    <text x="115" y="220" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="800" fill="#ffffff">Captura a tela</text>
    <text x="115" y="243" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="800" fill="#ffffff">em memória</text>
    <line x1="40" y1="275" x2="190" y2="275" stroke="#4A6FC7" stroke-opacity="0.3"/>
    <text x="115" y="305" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11.5" fill="#94a7de">Imagem nunca toca</text>
    <text x="115" y="324" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11.5" fill="#94a7de">o disco — vai direto</text>
    <text x="115" y="343" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11.5" fill="#94a7de">via HTTPS</text>
  </g>

  <path d="M550,370 L575,370" stroke="#4A6FC7" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

  <!-- ====== STAGE 03 ====== -->
  <g transform="translate(580,170)">
    <rect width="230" height="400" rx="22" fill="url(#cardBlue)" stroke="#4A6FC7" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="20" y="35" font-family="system-ui,sans-serif" font-size="11" font-weight="800" fill="#94a7de" letter-spacing="3">03</text>
    <g transform="translate(70,55)">
      <rect width="90" height="90" rx="14" fill="#0a1a3a" stroke="#94a7de" stroke-width="2"/>
      <g stroke="#94a7de" stroke-width="2">
        <line x1="20" y1="0" x2="20" y2="-8"/><line x1="35" y1="0" x2="35" y2="-8"/>
        <line x1="50" y1="0" x2="50" y2="-8"/><line x1="65" y1="0" x2="65" y2="-8"/>
        <line x1="20" y1="90" x2="20" y2="98"/><line x1="35" y1="90" x2="35" y2="98"/>
        <line x1="50" y1="90" x2="50" y2="98"/><line x1="65" y1="90" x2="65" y2="98"/>
        <line x1="0" y1="25" x2="-8" y2="25"/><line x1="0" y1="45" x2="-8" y2="45"/><line x1="0" y1="65" x2="-8" y2="65"/>
        <line x1="90" y1="25" x2="98" y2="25"/><line x1="90" y1="45" x2="98" y2="45"/><line x1="90" y1="65" x2="98" y2="65"/>
      </g>
      <text x="45" y="58" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="800" fill="#4A6FC7">AI</text>
    </g>
    <text x="115" y="220" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="800" fill="#ffffff">IA Vision</text>
    <text x="115" y="243" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="800" fill="#ffffff">classifica risco</text>
    <line x1="40" y1="275" x2="190" y2="275" stroke="#4A6FC7" stroke-opacity="0.3"/>
    <text x="115" y="305" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11.5" fill="#94a7de">Mistral Vision +</text>
    <text x="115" y="324" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11.5" fill="#94a7de">gatilhos do pai →</text>
    <text x="115" y="343" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11.5" fill="#94a7de">categoria + nível</text>
  </g>

  <path d="M815,370 L840,370" stroke="#4A6FC7" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

  <!-- ====== STAGE 04 ====== -->
  <g transform="translate(845,170)">
    <rect width="230" height="400" rx="22" fill="url(#cardDanger)" stroke="#dc2626" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="20" y="35" font-family="system-ui,sans-serif" font-size="11" font-weight="800" fill="#fca5a5" letter-spacing="3">04</text>
    <g transform="translate(85,50)">
      <path d="M30,5 Q40,18 35,30 Q45,25 42,42 Q35,32 30,42 Q22,32 28,5 Z" fill="#f97316"/>
      <path d="M30,15 Q36,22 32,32 Q38,28 36,40 Q31,32 28,40 Q25,30 30,15 Z" fill="#fbbf24"/>
      <g transform="translate(10,52)">
        <rect x="-2" y="2" width="54" height="9" rx="2" fill="#fca5a5"/>
        <rect x="18" y="-3" width="14" height="6" rx="1" fill="none" stroke="#fca5a5" stroke-width="2"/>
        <path d="M3,12 L7,68 L43,68 L47,12 Z" fill="none" stroke="#fca5a5" stroke-width="2.5"/>
        <line x1="15" y1="22" x2="17" y2="60" stroke="#fca5a5" stroke-width="2"/>
        <line x1="25" y1="22" x2="25" y2="60" stroke="#fca5a5" stroke-width="2"/>
        <line x1="35" y1="22" x2="33" y2="60" stroke="#fca5a5" stroke-width="2"/>
      </g>
    </g>
    <text x="115" y="220" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="800" fill="#ffffff">Imagem</text>
    <text x="115" y="243" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="800" fill="#ffffff">destruída</text>
    <line x1="40" y1="275" x2="190" y2="275" stroke="#fca5a5" stroke-opacity="0.3"/>
    <text x="115" y="305" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11.5" fill="#fca5a5">Apagada imediatamente</text>
    <text x="115" y="324" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11.5" fill="#fca5a5">após análise — não vai</text>
    <text x="115" y="343" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11.5" fill="#fca5a5">para banco nem pais</text>
  </g>

  <path d="M1080,370 L1105,370" stroke="#22c55e" stroke-width="2.5" fill="none" marker-end="url(#arrGreen)"/>

  <!-- ====== STAGE 05 ====== -->
  <g transform="translate(1110,170)">
    <rect width="230" height="400" rx="22" fill="url(#cardSafe)" stroke="#22c55e" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="20" y="35" font-family="system-ui,sans-serif" font-size="11" font-weight="800" fill="#86efac" letter-spacing="3">05</text>
    <g transform="translate(85,55)">
      <rect width="60" height="110" rx="10" fill="#0a1a3a" stroke="#86efac" stroke-width="2"/>
      <rect x="5" y="12" width="50" height="22" rx="3" fill="#dc2626" opacity="0.85"/>
      <circle cx="12" cy="23" r="3" fill="#ffffff"/>
      <line x1="19" y1="20" x2="50" y2="20" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="19" y1="26" x2="42" y2="26" stroke="#ffffff" stroke-width="1.3" stroke-opacity="0.75"/>
      <rect x="5" y="40" width="50" height="5" rx="2" fill="#94a7de" opacity="0.3"/>
      <rect x="5" y="50" width="50" height="5" rx="2" fill="#94a7de" opacity="0.3"/>
      <rect x="5" y="60" width="35" height="5" rx="2" fill="#94a7de" opacity="0.3"/>
      <rect x="5" y="70" width="45" height="5" rx="2" fill="#94a7de" opacity="0.3"/>
      <circle cx="30" cy="100" r="2.5" fill="#86efac"/>
      <g transform="translate(48,-4)">
        <circle cx="0" cy="0" r="12" fill="#dc2626"/>
        <text x="0" y="5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="800" fill="#ffffff">!</text>
      </g>
    </g>
    <text x="115" y="220" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="800" fill="#ffffff">Pai recebe</text>
    <text x="115" y="243" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="800" fill="#ffffff">alerta de texto</text>
    <line x1="40" y1="275" x2="190" y2="275" stroke="#86efac" stroke-opacity="0.3"/>
    <text x="115" y="305" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11.5" fill="#86efac" font-style="italic">"14h32 · Risco Alto</text>
    <text x="115" y="324" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11.5" fill="#86efac" font-style="italic">· apostas detectadas</text>
    <text x="115" y="343" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11.5" fill="#86efac" font-style="italic">no jogo X"</text>
  </g>

  <!-- Legenda -->
  <g transform="translate(700,630)">
    <rect x="-340" y="-22" width="680" height="44" rx="22" fill="#ffffff" fill-opacity="0.04" stroke="#4A6FC7" stroke-opacity="0.3"/>
    <circle cx="-290" cy="0" r="5" fill="#22c55e"/>
    <text x="-278" y="4" font-family="system-ui,sans-serif" font-size="12" fill="#ffffff">Imagem em RAM</text>
    <circle cx="-130" cy="0" r="5" fill="#dc2626"/>
    <text x="-118" y="4" font-family="system-ui,sans-serif" font-size="12" fill="#ffffff">Apagada após análise</text>
    <circle cx="70" cy="0" r="5" fill="#4A6FC7"/>
    <text x="82" y="4" font-family="system-ui,sans-serif" font-size="12" fill="#ffffff">Apenas texto persiste no banco</text>
  </g>
</svg>
