# /etc/nginx/sites-available/aura
# Substitui site3d. Aponta numik.com.br para o container Aura em 127.0.0.1:8001
# Aproveita os certificados Let's Encrypt ja emitidos para numik.com.br

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name numik.com.br www.numik.com.br;

    # Certificados existentes (validos ate 2026-08-13, auto-renovados pelo certbot)
    ssl_certificate /etc/letsencrypt/live/numik.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/numik.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Aumenta o limite de upload (capturas de tela podem ser grandes)
    client_max_body_size 20M;

    # Logs separados para nao misturar com o site antigo
    access_log /var/log/nginx/aura.access.log;
    error_log /var/log/nginx/aura.error.log;

    location = /favicon.ico { access_log off; log_not_found off; }

    # WhiteNoise dentro do container ja serve /static/ e /media/.
    # Apenas faz proxy de tudo.
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 90s;
    }
}

# Redirect HTTP -> HTTPS (mantem o comportamento atual do site3d)
server {
    listen 80;
    listen [::]:80;
    server_name numik.com.br www.numik.com.br;

    # Para certbot renovar via HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
